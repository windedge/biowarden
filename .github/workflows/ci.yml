name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build, vet, test
        run: CGO_ENABLED=0 go build ./... && CGO_ENABLED=0 go vet ./... && go test ./...

      - name: i18n check
        run: go tool mygo i18n check

      # Safety net: fail if any generated file (e.g. locales) was not committed.
      - name: Verify clean worktree
        run: git diff --exit-code
