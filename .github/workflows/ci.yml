name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build, vet, test
        run: CGO_ENABLED=0 go build ./... && CGO_ENABLED=0 go vet ./... && go test ./...

      - name: i18n check
        run: go tool mygo i18n check

      # Regenerate the catalogs, then fail if that changed anything: a stale
      # catalog_gen.go otherwise passes every other step.
      - name: Verify generated files are current
        run: go tool mygo generate && git diff --exit-code

      # The project writes ASCII hyphens only: no em dash (U+2014), no en dash (U+2013).
      # (*UTF) puts PCRE into UTF-8 mode, so the \x{} escapes match code points, not bytes.
      - name: Verify typography
        run: |
          if git grep -nP '(*UTF)[\x{2013}\x{2014}]' -- '*.md' '*.go' '*.json' '*.yml'; then
            echo "::error::Replace the dash with an ASCII hyphen."
            exit 1
          fi
          echo "No em or en dashes."
